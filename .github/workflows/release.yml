# Every tag is a release. Push a tag and this builds the DMG, writes release notes
# from the commits since the previous tag, and publishes the GitHub release:
#   v1.2.0         → a normal release, marked Latest
#   v1.3.0-beta.1  → a pre-release (Latest stays on the newest normal release)
#
# The easy way to make one is `scripts/release.sh patch|minor|major|X.Y.Z`, which
# bumps the version, commits, tags and pushes. Or use Actions → Release → Run
# workflow, which does the same on GitHub.
#
# Without secrets the DMG is unsigned. To sign and notarize, add repository secrets:
#   DEVELOPER_ID            "Developer ID Application: Your Name (TEAMID)"
#   DEVELOPER_ID_P12        that certificate exported as .p12, base64-encoded
#   DEVELOPER_ID_P12_PASSWORD
#   NOTARY_KEY_P8           App Store Connect API key (.p8), base64-encoded
#   NOTARY_KEY_ID, NOTARY_ISSUER
name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor, major, or an exact version like 1.2.0"
        required: true
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Releases are cut from main." >&2; exit 1
            fi
            VERSION=$(scripts/bump-version.sh "$BUMP")
            TAG="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "$TAG already exists." >&2; exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            # v1.2.3 or 1.2.3, with an optional -suffix for pre-releases.
            VERSION=$(sed -nE 's/^v?([0-9]+(\.[0-9]+){0,2})(-.*)?$/\1/p' <<<"$TAG")
          fi
          PRERELEASE=false
          [[ "$TAG" == *-* ]] && PRERELEASE=true
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "Releasing $TAG (version ${VERSION:-from project}, prerelease $PRERELEASE)"

      - name: Test
        # Snapshot images depend on the Mac's fonts and OS, so CI runs the logic tests only.
        run: |
          swift test --skip SnapshotTests
          scripts/coverage.sh --skip SnapshotTests

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Prepare notarization key
        if: env.HAS_NOTARY == 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build DMG
        env:
          DEVELOPER_ID: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID || '' }}
          NOTARY_KEY: ${{ env.HAS_NOTARY == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/make-dmg.sh

      - name: Commit version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

      - name: Write release notes
        run: |
          UNSIGNED=""
          [ "$HAS_NOTARY" = "true" ] || UNSIGNED="--unsigned"
          python3 scripts/release-notes.py "$TAG" --repo "$GITHUB_REPOSITORY" $UNSIGNED > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed-name copy, so releases/latest/download/Lanyard.dmg always works.
          cp build/Lanyard-*.dmg build/Lanyard.dmg
          if [ "$PRERELEASE" = "true" ]; then FLAGS=(--prerelease --latest=false); else FLAGS=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${FLAGS[@]}"
            gh release upload "$TAG" build/Lanyard-[0-9]*.dmg build/Lanyard.dmg --clobber
          else
            gh release create "$TAG" build/Lanyard-[0-9]*.dmg build/Lanyard.dmg --title "Lanyard ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${FLAGS[@]}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lanyard-${{ env.TAG }}
          path: build/Lanyard-*.dmg

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
