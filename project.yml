# Generates dotlocal.xcodeproj. Run: xcodegen generate
name: dotlocal
options:
  bundleIdPrefix: net.nickopolis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.0
targets:
  dotlocal:
    type: application
    platform: macOS
    sources:
      - path: Sources/Dotlocal
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_NAME: dotlocal
        PRODUCT_BUNDLE_IDENTIFIER: net.nickopolis.dotlocal
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Dotlocal.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
